spring:
  application:
    name: proactive-os
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:proactive_os}}
    username: ${DB_USERNAME:proactive_os}
    password: ${DB_PASSWORD:proactive_os}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: ${SERVER_PORT:8080}

proactiveos:
  security:
    jwt-secret: ${PROACTIVEOS_SECURITY_JWT_SECRET:}
    jwt-access-token-ttl: ${PROACTIVEOS_SECURITY_JWT_ACCESS_TOKEN_TTL:PT1H}
  ai:
    base-url: ${AI_BASE_URL:}
    model: ${AI_MODEL:}
    api-key: ${AI_API_KEY:}
    time-zone: ${AI_TIME_ZONE:UTC}
    log-raw-response: ${AI_LOG_RAW_RESPONSE:false}